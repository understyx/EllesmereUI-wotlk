name: Sync WotLK version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update addon versions
        run: bash .tools/update-version.sh

      - name: Commit the generated version
        run: |
          if git diff --quiet -- '*.toc'; then
            echo "Version metadata is already current."
            exit 0
          fi

          version=$(sed -n 's/^## Version: //p' EllesmereUI.toc)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.toc'
          git commit -m "chore: sync version to ${version}"
          git push
